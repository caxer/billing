<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="color-scheme" content="light dark"/>
<meta name="robots" content="noindex"/>
<title>帳本紀錄</title>
<link rel="manifest" href="app.webmanifest"/>
<link rel="icon" href="icon.svg" type="image/svg+xml"/>
<link rel="apple-touch-icon" href="icon.svg"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="帳本紀錄"/>
<meta name="theme-color" content="#0f766e" media="(prefers-color-scheme: light)"/>
<meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)"/>
<link rel="stylesheet" href="style.css"/>
<link rel="stylesheet" href="login-screen.css">
</head>
<body>

<div id="lock" class="auth-screen">
  <div class="login-page">
    <div class="login-brand"><span class="brand-mark"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4z M4 9h16 M8 13h3 M8 16h7"/></svg></span>帳本紀錄</div>
    <div class="login-intro"><span class="eyebrow">YOUR MONEY, AT A GLANCE</span><h1>每一筆收支，<br>清楚記錄。</h1><p>家庭收支與月結，一個地方就看得到。</p></div>
    <section class="login-card" aria-label="登入帳本紀錄">
      <span class="login-lock"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path data-login-icon d="M7 11V7a5 5 0 0 1 10 0v4 M5 11h14v10H5z M12 15v2"/></svg></span>
      <h2 id="lock-title">解鎖你的帳本</h2>
      <p class="muted" id="lock-hint">每次開啟或回到網站會自動驗證；取消後可重試或使用密碼。</p>
      <div class="login-options" data-login-face hidden>
        <button type="button" class="login-primary" id="lock-biometric" data-login-biometric hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H4v4 M16 3h4v4 M4 17v4h4 M20 17v4h-4 M8 9v2 M16 9v2 M12 9v4h-1 M8 16s4 3 8 0"/></svg><span data-login-biometric-label>Face ID／通行金鑰登入</span></button>
        <button type="button" class="text-button" data-login-password-choice>使用密碼登入</button>
      </div>
      <form id="lock-form" class="login-form" data-login-password><input class="autofill-username" name="username" autocomplete="username" value="billing-owner" tabindex="-1" aria-hidden="true">
          <label for="lock-password">登入密碼</label>
          <div class="password-field"><input id="lock-password" data-login-field name="password" type="password" autocomplete="current-password" placeholder="輸入原本的密碼" aria-label="帳本密碼" enterkeyhint="go" required><button id="lock-password-toggle" data-login-toggle type="button" class="password-toggle" aria-controls="lock-password" aria-label="顯示密碼" aria-pressed="false">顯示</button></div>
          <button id="lock-submit" type="submit" class="login-primary"><span data-login-submit-label>解鎖帳本內容</span><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14 M14 7l5 5-5 5"/></svg></button>
          <button type="button" class="text-button" data-login-face-choice hidden>改用 Face ID 登入</button></form>
      <p id="lock-error" class="login-error" role="alert" hidden></p>
    </section>
    <p class="privacy-note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V7a5 5 0 0 1 10 0v4 M5 11h14v10H5z M12 15v2"/></svg>資料加密保護，密碼不會儲存於網站。</p>
  </div>
</div>

<div id="who" class="lock" hidden>
  <div class="lock-card">
    <h1>這支手機是</h1>
    <p class="lock-hint">記帳時會預設選這個人。兩支手機請各選各的，不然會記成同一人。之後可以在「設定」改。</p>
    <div id="who-choices" class="who-choices"></div>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-row">
      <h1 id="view-title">看板</h1>
      <button id="sync-state" class="sync" type="button" aria-label="重新同步帳本" title="重新同步帳本" aria-live="polite">載入中</button>
    </div>
    <div id="month-nav" class="month-nav" hidden>
      <button id="month-prev" type="button" aria-label="上個月">‹</button>
      <button id="month-label" type="button" aria-label="回到本月">—</button>
      <button id="month-next" type="button" aria-label="下個月">›</button>
    </div>
  </header>

  <main>
    <section id="view-dashboard" class="view"></section>

    <section id="view-add" class="view" hidden>
      <p class="form-context">選分類、記金額，月結與年度統計會一起更新。</p>
      <div class="seg" role="group" aria-label="收支類型">
        <button type="button" class="seg-btn is-on" data-type="expense" aria-pressed="true">支出</button>
        <button type="button" class="seg-btn" data-type="income" aria-pressed="false">收入</button>
      </div>

      <form id="add-form" class="card add-form">
        <label class="amount-row">
          <span id="amount-sign" class="amount-sign">−</span>
          <input id="add-amount" type="text" inputmode="numeric" placeholder="0"
                 autocomplete="off" aria-label="金額（元）" aria-describedby="add-error" enterkeyhint="done" required/>
          <span class="amount-unit">元</span>
        </label>

        <div class="field">
          <label class="field-label" for="add-date">日期</label>
          <div class="date-controls">
            <div class="date-button">
              <span class="date-pick" id="add-date-text" aria-hidden="true">選擇日期</span>
              <input id="add-date" type="date"/>
            </div>
            <div class="date-shortcuts" role="group" aria-label="快速選擇日期">
              <button type="button" class="chip" data-day="today">今天</button>
              <button type="button" class="chip" data-day="yesterday">昨天</button>
            </div>
          </div>
        </div>

        <label class="field">
          <span class="field-label">分類</span>
          <select id="add-category" required></select>
          <span id="add-category-hint" class="setting-hint"></span>
        </label>

        <label class="field">
          <span class="field-label">內容</span>
          <input id="add-note" type="text" placeholder="例如：超市採買" enterkeyhint="done"/>
        </label>

        <label class="field">
          <span class="field-label">誰記的</span>
          <select id="add-by" required></select>
        </label>

        <p id="add-error" class="form-error" role="alert" hidden></p>
        <button type="submit" class="btn-primary btn-block" id="add-submit">記下來</button>
        <div class="date-row" id="add-cancel-row">
          <button type="button" class="btn-quiet" id="add-cancel" hidden>取消編輯</button>
          <button type="button" class="btn-quiet danger-button" id="add-delete" hidden>刪除這筆</button>
        </div>
      </form>
    </section>

    <section id="view-stats" class="view" hidden></section>

    <section id="view-billing" class="view" hidden></section>

    <section id="view-settings" class="view" hidden></section>
  </main>

  <nav class="tabs" aria-label="主要分頁">
    <button type="button" class="tab is-on" data-view="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10 12 3l9 7v10H3Z M9 20v-7h6v7"/></svg><span>看板</span></button>
    <button type="button" class="tab" data-view="add"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="5"/><path d="M12 8v8M8 12h8"/></svg><span>記帳</span></button>
    <button type="button" class="tab" data-view="stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10m8 10V4m8 16v-7"/></svg><span>統計</span></button>
    <button type="button" class="tab" data-view="billing"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M7 2v4m10-4v4M3 9h18M7 13h3m4 0h3M7 17h3m4 0h3"/></svg><span>月結</span></button>
    <button type="button" class="tab" data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></svg><span>設定</span></button>
  </nav>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
